# Render Blueprint — deploys the backend API, the static frontend, and a
# free PostgreSQL database in one go.

databases:
  - name: recommendation-db
    plan: free
    databaseName: admissions_poc
    user: admissions_poc

services:
  - type: web
    name: recommendation-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: DATABASE_URL
        fromDatabase:
          name: recommendation-db
          property: connectionString

      - key: ALLOWED_ORIGINS
        value: "*"

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: SENDGRID_API_KEY
        sync: false

      - key: NOTIFICATION_FROM_EMAIL
        sync: false

  - type: web
    name: recommendation-frontend
    runtime: static
    rootDir: frontend/student-form
    buildCommand: ""
    staticPublishPath: .